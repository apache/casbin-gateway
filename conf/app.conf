; This file seeds the settings on the very first start. Casbin Gateway then
; keeps them in its database and reads them from there, so a line changed below
; afterwards has no effect — use the Settings page of the web UI instead. The
; exceptions are the keys read before the database is open: "appname",
; "httpport", "runmode", "driverName", "dataSourceName", "dbName" and
; "redisEndpoint". Those are only ever read from this file.

appname = casbin-gateway
; Port of the management UI and the REST API. Whatever is already listening on
; it is killed on startup, so a previous run does not have to be stopped by hand.
httpport = 17000
; Interface the management UI binds to. It is loopback by default: the local
; admin is signed in without a password and the relay hands out the provider
; keys, so exposing both to the network is opt-in. Set it to 0.0.0.0 to serve
; other machines, and change the admin password before you do. One address is
; opened regardless: while an agent that runs in a sandbox of its own is routed
; through the gateway, this host's own address is served too, since loopback
; inside such a sandbox is the sandbox rather than this machine.
httpaddr = 127.0.0.1
runmode = dev
SessionOn = true
copyrequestbody = true

; Database. An empty "dataSourceName" means "./data/casbin-gateway.db"; "dbName" is
; unused by SQLite. XORM is used, so mysql, postgres, mssql and sqlite are all
; supported. To use MySQL instead, replace the two lines below with:
;   driverName = mysql
;   dataSourceName = root:123@tcp(localhost:3306)/
; Gateway then creates "dbName" on first start if it does not exist.
driverName = sqlite
dataSourceName =
dbName = casbin_gateway
; Optional Redis for sessions. Sessions are kept in ./tmp files when empty.
redisEndpoint =

; Optional AES-256-GCM encryption for provider API keys at rest. Any length works
; ("openssl rand -base64 32"); leave it empty to keep storing keys as plaintext.
; Existing plaintext keys are re-written as ciphertext the first time they are
; read, so turning this on needs no manual step. Back the key up with the
; database: losing it makes already-encrypted keys unreadable.
apiKeyEncryptionKey =

; Optional SOCKS5 proxy ("host:port") for outbound traffic such as update
; downloads.
httpProxy = ""

; Casdoor is optional. Leave "casdoorEndpoint" empty to sign in against Gateway's
; own user table instead, with the built-in "admin" account (password "123").
; Filling in all five values below switches sign-in over to Casdoor SSO.
casdoorEndpoint =
; casdoorEndpoint = https://door.casdoor.com
clientId =
clientSecret =
casdoorOrganization =
casdoorApplication =

; Demo mode makes the REST API read-only: only sign-in and sign-out may write.
isDemoMode = false

; Agent patch manifests, config backups, ingest tokens, and file-tail cursors.
; Agent activity records themselves are held only in memory.
agentPatchStateDir = "./data/agent-patches"
; How many agent monitoring records to keep in memory. They are never persisted,
; so this is also the memory bound for the live window.
agentRecordCapacity = 1000
; How often to rescan the append-only logs of file-tailed agents, in seconds.
agentMonitorPollSeconds = 5

; Channel probes. A probe sends four short requests to a provider's upstream to
; check that what answers is what it claims to be: the model name it reports,
; the vendor headers it carries, the shape of its event stream, whether prompt
; caching is really accounted for, and whether two identical requests are billed
; the same. It spends a few cents of that provider's own credit.
; "auto" probes a provider when it is added, when its endpoint, type or key
; changes, and once for any provider that has never been probed. "manual" only
; probes when the button on the Providers page is pressed. "off" never probes.
providerProbeMode = "auto"

; LLM request records. "off" keeps nothing, "metadata" records who called which
; model with which outcome, and "full" also stores the sanitized request body.
; The default is "full": the records are what the dashboards are made of, and
; they stay on this machine. Set it to "metadata" or "off" to keep less.
llmRecordMode = "full"
llmRecordQueueCapacity = 1000
llmRecordRetentionDays = 30
llmRecordMaxRecords = 10000
; Largest request body kept per record. A body over it keeps its structure and
; loses only its longest strings.
llmRecordMaxPayloadBytes = 1048576
; Optional JSON file of token prices in US dollars per million, overriding the
; built-in list prices, e.g. {"my-model": {"input": 1, "output": 3, "cacheWrite": 1.25, "cacheRead": 0.1}}.
llmPricingFile = "./data/llm-pricing.json"
