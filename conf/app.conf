appname = casbin-gateway
; Port of the management UI and the REST API. Whatever is already listening on
; it is killed on startup, so a previous run does not have to be stopped by hand.
httpport = 17000
runmode = dev
SessionOn = true
copyrequestbody = true

; Database. An empty "dataSourceName" means "./data/casbin-gateway.db"; "dbName" is
; unused by SQLite. XORM is used, so mysql, postgres, mssql and sqlite are all
; supported. To use MySQL instead, replace the two lines below with:
;   driverName = mysql
;   dataSourceName = root:123@tcp(localhost:3306)/
; Gateway then creates "dbName" on first start if it does not exist.
driverName = sqlite
dataSourceName =
dbName = casbin_gateway
; Optional Redis for sessions. Sessions are kept in ./tmp files when empty.
redisEndpoint =

; Optional AES-256-GCM encryption for channel API keys at rest. When set, keys
; are encrypted before they are written to the database (the value is hashed to
; a 32-byte key, so any length works). Leave it empty to keep storing keys as
; plaintext. Existing plaintext keys keep working and are upgraded to ciphertext
; the next time the key is re-entered and saved. Changing or losing this key
; makes already-encrypted keys unreadable.
apiKeyEncryptionKey =

; The reverse-proxy gateway, i.e. the WAF itself. It is off by default because
; ports 80 and 443 usually belong to something else on the host, and binding
; them needs root on Linux and macOS. Sites and rules can still be configured
; while it is off, but nothing is proxied until it is turned on. Turning it on
; also means the two ports below are taken over on startup, killing whatever
; holds them, so do not point them at a web server that has to keep running.
gatewayEnabled = false
gatewayHttpPort = 80
gatewayHttpsPort = 443

; Optional SOCKS5 proxy ("host:port") for outbound traffic such as ACME.
httpProxy = ""

; Casdoor is optional. Leave "casdoorEndpoint" empty to sign in against Gateway's
; own user table instead, with the built-in "admin" account (password "123").
; Filling in all five values below switches sign-in over to Casdoor SSO and
; enables the Casdoor-backed features: site SSO, CAPTCHA rules, alert providers
; and the resource storage provider.
casdoorEndpoint =
; casdoorEndpoint = https://door.casdoor.com
clientId =
clientSecret =
casdoorOrganization =
casdoorApplication =

; Demo mode makes the REST API read-only: only sign-in and sign-out may write.
isDemoMode = false

; Parent directory of the application source trees that Gateway deploys and
; restarts. Only used by the "run" feature; a relative path is resolved against
; the working directory.
appDir = "./data/apps"

; Optional Alibaba Cloud RDS credentials, used to provision a database for a
; newly deployed application. Leave empty to skip cloud database provisioning.
dbRegionId = ""
dbAccessKeyId = ""
dbAccessKeySecret = ""
dbInstanceId = ""
dbHost = ""
dbUser = ""
dbPass = ""

; Prefixes prepended to the Casdoor client ID and secret that are written into a
; deployed application's own app.conf.
clientIdPrefix = ""
clientSecretPrefix = ""
; Default language written into a deployed application's own app.conf.
language = "en"
; Optional JSON object renaming deployed applications, e.g. {"casdoor": "cc"}.
appMap =

; ACME account used to issue Let's Encrypt certificates for sites.
acmeEmail = ""
acmePrivateKey = ""

; Agent patch manifests, config backups, ingest tokens, and file-tail cursors.
; Agent activity records themselves are held only in memory.
agentPatchStateDir = "./data/agent-patches"
; How many agent monitoring records to keep in memory. They are never persisted,
; so this is also the memory bound for the live window.
agentRecordCapacity = 1000
; How often to rescan the append-only logs of file-tailed agents, in seconds.
agentMonitorPollSeconds = 5
