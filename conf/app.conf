; Seeds the settings on the very first start. Casbin Gateway then keeps them in
; its database, so a line changed here afterwards has no effect — use the
; Settings page of the web UI. The exceptions, read before the database is open,
; are "appname", "httpport", "runmode", "driverName", "dataSourceName", "dbName"
; and "redisEndpoint".

appname = casbin-gateway
; Port of the management UI and the REST API. Whatever already holds it is
; killed on startup.
httpport = 17000
; Interface the management UI binds to. Loopback by default: the local admin is
; signed in without a password and the relay hands out the provider keys, so
; change that password before serving other machines with 0.0.0.0. This host's
; own address is always served too, for agents that run in a sandbox of their
; own, where loopback is the sandbox rather than this machine.
httpaddr = 127.0.0.1
runmode = dev
copyrequestbody = true

; Extra names Gateway answers to, comma-separated, for a reverse proxy or any
; other name that is not this machine's. Its own addresses, "localhost" and its
; hostname always work; a browser request for any other name is refused, so that
; a domain pointed at 127.0.0.1 cannot drive Gateway through the operator's
; browser.
allowedHosts =
; Browser origins allowed to call the API from another site, comma-separated and
; written in full, e.g. "https://app.example.com". The web UI needs none of
; these; a page of your own that calls the relay does.
allowedOrigins =

; Database. XORM is used, so mysql, postgres, mssql and sqlite are all supported.
; An empty "dataSourceName" means "./data/casbin-gateway.db"; "dbName" is unused
; by SQLite and created on first start by the others. For MySQL:
;   driverName = mysql
;   dataSourceName = root:123@tcp(localhost:3306)/
driverName = sqlite
dataSourceName =
dbName = casbin_gateway
; Optional Redis for sessions. Sessions are kept in ./tmp files when empty.
redisEndpoint =

; Optional AES-256-GCM encryption for provider API keys at rest, any length
; ("openssl rand -base64 32"). Existing plaintext keys are re-written as
; ciphertext when read, so turning this on needs no manual step. Back the key up
; with the database: losing it makes encrypted keys unreadable.
apiKeyEncryptionKey =

; Optional SOCKS5 proxy ("host:port") for outbound traffic such as updates.
httpProxy = ""

; Casdoor is optional. Leave "casdoorEndpoint" empty to sign in against Gateway's
; own user table, with the built-in "admin" account (password "123"); filling in
; all five values switches sign-in over to Casdoor SSO.
casdoorEndpoint =
; casdoorEndpoint = https://door.casdoor.com
clientId =
clientSecret =
casdoorOrganization =
casdoorApplication =

; Demo mode makes the REST API read-only: only sign-in and sign-out may write.
isDemoMode = false

; Agent patch manifests, config backups, ingest tokens and file-tail cursors.
agentPatchStateDir = "./data/agent-patches"
; How many agent monitoring records to keep. They are stored in the database,
; and the oldest are pruned once the table is over this many rows.
agentRecordCapacity = 1000
; How often to rescan the append-only logs of file-tailed agents, in seconds.
agentMonitorPollSeconds = 5

; Channel probes. A probe spends a few cents of a provider's own credit asking
; its upstream a suite of test cases — published and editable on the
; Authenticity page — and scores out of 100 what answers: the model it reports
; and the vendor it says trained it, anything injected in front of the request,
; parameters quietly dropped, and the envelope it all comes back in.
; "auto" probes a provider when it is added or changed and whenever its report
; goes stale, "manual" only on request, "off" never.
providerProbeMode = "auto"
; How long a probe report stays current. Re-probing is the only thing that shows
; an upstream swapped behind a provider that itself never changed.
providerProbeIntervalHours = 24

; LLM request records. "off" keeps nothing, "metadata" records who called which
; model with which outcome, and "full" also stores the sanitized request body.
; They stay on this machine and are what the dashboards are made of.
llmRecordMode = "full"
llmRecordQueueCapacity = 1000
llmRecordRetentionDays = 30
llmRecordMaxRecords = 10000
; Largest request body kept per record. A body over it keeps its structure and
; loses only its longest strings.
llmRecordMaxPayloadBytes = 1048576
; Optional JSON file of token prices in US dollars per million, overriding the
; built-in list prices, e.g. {"my-model": {"input": 1, "output": 3, "cacheWrite": 1.25, "cacheRead": 0.1}}.
llmPricingFile = "./data/llm-pricing.json"
