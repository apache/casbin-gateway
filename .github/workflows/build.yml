name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  go-tests:
    name: Running Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.8'
          cache-dependency-path: ./go.mod
      - name: Tests
        run: |
        # go test -v $(go list ./...) -tags skipCi
        working-directory: ./

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: ./web/yarn.lock
      - run: yarn install && yarn build
        working-directory: ./web

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.8'
          cache-dependency-path: ./go.mod
      - run: go version
      - name: Build
        run: |
          go build -race -ldflags "-extldflags '-static'"
        working-directory: ./

  # The desktop launcher is a separate module with platform-specific files that
  # nothing else compiles, so each of the three is built here.
  desktop:
    name: Desktop launcher (${{ matrix.os }})
    needs: [ go-tests ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache-dependency-path: ./desktop/go.mod

      # webview_go asks pkg-config for webkit2gtk-4.0, which this Ubuntu no
      # longer ships; the shim points that name at the 4.1 it does.
      - name: Install the Linux dependencies
        if: ${{ matrix.goos == 'linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p "${RUNNER_TEMP}/pkgconfig"
          cat > "${RUNNER_TEMP}/pkgconfig/webkit2gtk-4.0.pc" <<'PC'
          Name: webkit2gtk-4.0
          Description: Shim mapping webkit2gtk-4.0 onto the installed 4.1
          Version: 4.1
          Requires: webkit2gtk-4.1
          PC
          echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/pkgconfig" >> "${GITHUB_ENV}"

      - name: Build
        run: go build ./...
        working-directory: ./desktop
